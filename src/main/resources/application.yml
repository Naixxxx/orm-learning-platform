spring:
  application:
    name: orm-learning-platform
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/learning}
    username: ${DB_USERNAME:learning}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_batch_fetch_size: 32
        jdbc:
          time_zone: UTC
  liquibase:
    change-log: classpath:db/changelog/master.xml
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  error:
    include-message: never
  shutdown: graceful
app:
  jwt:
    secret: ${JWT_SECRET}
    lifetime: PT2H
  demo:
    enabled: false
springdoc:
  swagger-ui:
    path: /swagger-ui.html
